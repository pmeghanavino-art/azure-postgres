spring:
  application:
    name: azure

  datasource:
    url: jdbc:postgresql://postgres-container:5432/azure
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect